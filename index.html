/* ---- OOP ---- */
{t:3, name:"Access Modifier & Patterns ในโค้ด", icon:"🗝️",
 lessons:[
  {h:"Access Modifier", b:`<ul><li><b>public</b> ใครก็เข้าถึงได้</li><li><b>protected</b> class ลูกเข้าถึงได้ (TypeScript)</li><li><b>private</b> เข้าถึงได้เฉพาะใน class นี้ · JavaScript ใช้ <code>#field</code></li><li><b>readonly</b> กำหนดค่าได้ครั้งเดียว</li></ul><p>ใช้เพื่อทำ <b>encapsulation</b> จริง ๆ ไม่ให้ภายนอกแก้ state ข้ามกฎธุรกิจ</p>`, lang:"JavaScript / TypeScript",
   code:`class Account {                      // JavaScript
  #balance = 0;                      // private field
  deposit(amount) {
    if (amount <= 0) throw new Error("amount must be > 0");
    this.#balance += amount;
  }
  get balance() { return this.#balance; }
}

class User {                         // TypeScript
  public name: string;
  protected role: string;
  private passwordHash: string;
  readonly id: number;
}`},
  {h:"Association, Aggregation, Composition", b:`<ul><li><b>Aggregation</b> (has-a แบบหลวม) ส่วนประกอบมีชีวิตอยู่ได้เองแม้เจ้าของหายไป เช่น Team มี Player เมื่อทีมยุบ ผู้เล่นยังอยู่</li><li><b>Composition</b> (has-a แบบแน่น) ส่วนประกอบหายไปพร้อมเจ้าของ เช่น Order มี OrderItem</li></ul><p>ออกแบบให้ <b>High Cohesion</b> คือของในโมดูลเกี่ยวข้องกันมาก และ <b>Low Coupling</b> คือพึ่งพาโมดูลอื่นน้อย</p>`},
  {h:"Decorator, Adapter, Observer, Factory", b:`<p>pattern เหล่านี้มักออกในข้อสอบแบบ code review:</p>`, lang:"JavaScript",
   code:`// Decorator: ห่อเพื่อเพิ่ม behavior โดยไม่แก้ของเดิม
const withLog = fn => (...args) => { console.log("call", args); return fn(...args); };

// Adapter: แปลง interface เก่าให้ตรงกับที่ระบบใช้
class SmsAdapter {
  constructor(legacy) { this.legacy = legacy; }
  send(to, msg) { return this.legacy.sendSMS({ phone: to, text: msg }); }
}

// Observer: publisher แจ้ง subscriber
class Emitter {
  subs = [];
  on(fn) { this.subs.push(fn); }
  emit(e) { this.subs.forEach(fn => fn(e)); }
}

// Factory: รวมการสร้าง object ไว้ที่เดียว
function createGateway(type) {
  if (type === "card") return new CardGateway();
  if (type === "qr") return new QRGateway();
  throw new Error("unknown type " + type);
}`}
 ],

{t:4, name:"Git ในงานทีม", icon:"🤝",
 lessons:[
  {h:"HEAD, origin, upstream, detached HEAD", b:`<ul><li><b>HEAD</b> ตำแหน่งที่เรากำลังทำงานอยู่</li><li><b>origin</b> ชื่อ remote ที่ตั้งให้เป็นค่าเริ่มต้นตอน clone</li><li><b>upstream</b> repo ต้นทางของ fork หรือ branch บน remote ที่ branch เรา track อยู่</li><li><b>Detached HEAD</b> เกิดเมื่อ checkout commit หรือ tag แทน branch ถ้า commit ต่อ งานอาจหายได้ ให้สร้าง branch ก่อน</li></ul>`, lang:"bash",
   code:`git remote -v
git checkout v1.20.0          # ⚠️ detached HEAD
git switch -c hotfix/login    # สร้าง branch เก็บงาน

# ถ้าจำเป็นต้อง force push (เช่นหลัง rebase branch ของตัวเอง)
git push --force-with-lease   # ปฏิเสธถ้ามีคนอื่น push ทับไปก่อน`},
  {h:"แก้ Conflict อย่างเป็นขั้นตอน", b:`<p>อ่านทั้งสองฝั่งให้เข้าใจก่อน ห้ามเลือกฝั่งใดฝั่งหนึ่งโดยไม่ดูโค้ด และ<b>ต้องรันเทสต์</b>ก่อน commit</p>`, flow:["git pull / merge","เปิดไฟล์ที่ conflict","รวมโค้ด + ลบ marker","รันเทสต์","git add","git commit"]},
  {h:"Pull Request ที่ดี และ Semantic Versioning", b:`<ul><li>PR ควร<b>เล็ก</b> ทำเรื่องเดียว มีคำอธิบายว่าเปลี่ยนอะไรและทำไม พร้อมเทสต์</li><li><b>Git Flow</b> เหมาะกับงานที่มีรอบ release · <b>Trunk-based</b> เหมาะกับการ deploy บ่อยร่วมกับ feature flag</li><li><b>SemVer</b> MAJOR.MINOR.PATCH: มี breaking change ขึ้น MAJOR, เพิ่มฟีเจอร์ที่เข้ากันได้ขึ้น MINOR, แก้บั๊กขึ้น PATCH</li></ul>`}

{t:5, name:"Web Fundamentals เชิงลึก", icon:"🎨",
 lessons:[
  {h:"CSS Box Model และ Responsive", b:`<p>ขนาดของกล่องประกอบด้วย <b>content + padding + border + margin</b></p><p>ค่าเริ่มต้นคือ <code>content-box</code> ทำให้ <code>width</code> ไม่รวม padding และ border ส่วน <code>border-box</code> รวมให้แล้ว คำนวณง่ายกว่า</p><p>Responsive: ออกแบบแบบ mobile-first, ใช้ media query, flexbox และ grid</p>`, lang:"CSS",
   code:`.card { width: 200px; padding: 20px; border: 2px solid; }
/* content-box: กว้างจริง = 200 + 20×2 + 2×2 = 244px */

* { box-sizing: border-box; }
/* border-box: กว้างจริง = 200px */`},
  {h:"DOM, Event, State และ Lazy Loading", b:`<ul><li>Event จะ <b>bubble</b> ขึ้นไปยัง parent จึงใช้ <b>event delegation</b> ติด listener ที่ parent ตัวเดียวได้</li><li><b>State management</b> คือการเก็บ state ไว้ที่เดียวแล้วให้ UI render ตาม state</li><li><b>Lazy loading</b> โหลดเฉพาะเมื่อจำเป็น · <b>Code splitting</b> แบ่ง bundle ให้เล็กลง</li></ul>`, lang:"JavaScript / HTML",
   code:`// Event delegation
list.addEventListener("click", e => {
  const btn = e.target.closest("button[data-id]");
  if (btn) removeItem(btn.dataset.id);
});

// Code splitting: โหลด module เมื่อจะใช้จริง
const { drawChart } = await import("./chart.js");

<img src="photo.jpg" loading="lazy" alt="รูปสินค้า">`},
  {h:"Browser Storage และ CORS", b:`<ul><li><b>localStorage</b> อยู่ถาวรและ JS อ่านได้ จึง<b>ไม่ควรเก็บ token</b> ที่สำคัญ เพราะ XSS ขโมยได้</li><li><b>sessionStorage</b> หายเมื่อปิดแท็บ</li><li><b>Cookie แบบ HttpOnly + Secure + SameSite</b> JS อ่านไม่ได้ เหมาะกับ session</li></ul><p><b>CORS</b>: browser จะบล็อกการเรียก API ข้าม origin เว้นแต่ server ตอบ header <code>Access-Control-Allow-Origin</code> อนุญาต CORS ไม่ใช่กลไกป้องกันฝั่ง server และห้ามใช้ <code>*</code> ร่วมกับ credentials</p>`}

{t:5, name:"API Design & Lifecycle", icon:"🧾",
 lessons:[
  {h:"Validation, Error Handling และ Status Code", b:`<ul><li><b>400</b> request ผิดรูปแบบ เช่น parse JSON ไม่ได้</li><li><b>422</b> รูปแบบถูก แต่ข้อมูลผิดกฎ เช่น อายุติดลบ</li><li><b>409</b> ชนกับสถานะปัจจุบัน เช่น email ซ้ำ หรือ version ไม่ตรง</li><li><b>429</b> เกิน rate limit (ส่ง header <code>Retry-After</code> กลับไปด้วย)</li><li><b>202</b> รับไว้แล้วจะประมวลผลภายหลัง · <b>204</b> สำเร็จแต่ไม่มี body</li><li><b>502</b> gateway ได้คำตอบเสียจาก upstream · <b>503</b> บริการไม่พร้อม · <b>504</b> upstream ตอบช้าเกินเวลา</li></ul><p>ส่ง error body ในรูปแบบเดียวกันทุก endpoint:</p>`, lang:"JSON",
   code:`{ "error": { "code": "EMAIL_TAKEN",
             "message": "อีเมลนี้ถูกใช้แล้ว",
             "field": "email" } }`},
  {h:"Versioning และ Backward Compatibility", b:`<ul><li><b>Backward compatible</b>: เพิ่ม field ใหม่แบบ optional หรือเพิ่ม endpoint ใหม่</li><li><b>Breaking change</b>: ลบหรือเปลี่ยนชื่อ field, เปลี่ยนชนิดข้อมูล หรือเปลี่ยนความหมาย ต้องออก <b>version ใหม่</b> เช่น <code>/v2/</code></li><li><b>Deprecation</b>: ประกาศล่วงหน้า กำหนดวันเลิกใช้ (header Deprecation/Sunset) และติดตามว่ายังมีใครเรียกอยู่</li><li><b>Contract-first</b>: เขียน spec เช่น OpenAPI ให้ทีมตกลงกันก่อนเขียนโค้ด แล้วใช้ <b>schema validation</b> ตรวจ request/response</li></ul>`},
  {h:"API Lifecycle, Gateway และ Rate Limiting", b:`<p><b>API Gateway</b> เป็นจุดรวมเรื่อง auth, rate limiting, routing และ logging</p><p><b>Rate limiting</b> มักใช้ token bucket หรือ fixed/sliding window เพื่อกันผู้ใช้หรือบอทเรียกถี่เกินไป และทำ <b>API documentation</b> ให้ตรงกับของจริงเสมอ</p>`, flow:["Design","Review","Implement","Test","Publish","Observe","Deprecate","Retire"]}
 ],

/* ---- System Design ---- */
{t:6, name:"Case Study: URL Shortener", icon:"🗺️",
 lessons:[
  {h:"Requirement และการประมาณโหลด", b:`<p><b>Functional</b>: สร้างลิงก์สั้น และ redirect ไปลิงก์จริง</p><p><b>Non-functional</b>: redirect เร็ว (&lt; 100ms), availability สูง และสัดส่วนอ่านต่อเขียน 100:1</p>`, lang:"ประมาณการ",
   code:`ลิงก์ใหม่ 1 ล้าน/วัน   → 1,000,000 / 86,400 ≈ 12 writes/s
อ่าน 100 เท่า          → ≈ 1,200 reads/s (peak อาจ ×3–5)
พื้นที่ 5 ปี           → 1M × 365 × 5 × ~500 bytes ≈ 0.9 TB`},
  {h:"High-level Architecture", b:`<ul><li>API เป็น <b>stateless</b> หลายตัวอยู่หลัง <b>Load Balancer</b> จึง scale แนวนอนได้</li><li>ทำ <b>Cache</b> เช่น Redis สำหรับลิงก์ยอดนิยม เพราะการอ่านมากกว่าเขียนมาก</li><li>สร้างรหัสสั้นด้วย base62 ของ ID หรือสุ่มแล้วใช้ <b>UNIQUE constraint</b> กันชนกัน</li><li><b>Stateful</b> (เช่น DB) ต้องดูแลเรื่อง replica และ failover ส่วน stateless เพิ่มหรือลดได้อิสระ</li></ul>`, flow:["Client","Load Balancer","API ×N (stateless)","Cache","Database (+replica)"]},
  {h:"Failure, Resilience และ Trade-off", b:`<ul><li>กำจัด <b>Single Point of Failure</b> ด้วยหลาย instance, DB replica และหลาย AZ</li><li><b>High Availability / Fault Tolerance</b>: ระบบยังให้บริการได้แม้บางส่วนล้ม</li><li>เก็บ click analytics แบบ <b>async ผ่าน queue</b> เพื่อไม่ให้ redirect ช้า</li><li>ใช้ rate limiting กันการสร้างลิงก์สแปม</li><li>Trade-off: <b>301</b> browser cache ไว้ เร็วกว่าแต่นับคลิกไม่ได้ ส่วน <b>302</b> ผ่าน server ทุกครั้ง นับคลิกได้</li></ul>`}
 ],

{t:7, name:"Microservices ในงานจริง", icon:"🕸️",
 lessons:[
  {h:"Bounded Context และ Service Discovery", b:`<p><b>Bounded Context</b>: คำเดียวกันอาจมีความหมายต่างกันในแต่ละโดเมน เช่น “Customer” ในฝ่ายขายกับฝ่ายซัพพอร์ต ให้แบ่ง service ตาม context</p><p><b>Service Discovery</b>: instance เพิ่มลดตลอดเวลา จึงต้องมี registry หรือ DNS (เช่นใน Kubernetes) ให้หา address ของ service ปลายทาง</p>`},
  {h:"Security ระหว่าง Service", b:`<ul><li><b>mTLS</b>: ทั้งสองฝั่งแสดง certificate ยืนยันตัวตนกัน และเข้ารหัสระหว่างทาง</li><li><b>OAuth2 Client Credentials</b>: ให้ service ขอ token มาเรียก service อื่น</li><li>ส่ง <b>JWT</b> ของผู้ใช้ต่อไปเพื่อตรวจสิทธิ์ปลายทาง</li><li><b>Zero Trust</b>: แม้อยู่ใน network ภายในก็ต้องยืนยันตัวตนทุกครั้ง</li></ul>`},
  {h:"Saga แบบ Orchestration vs Choreography", b:`<p><b>Orchestration</b>: มีตัวกลางสั่งงานทีละขั้น อ่าน flow และ debug ง่าย แต่ตัวกลางผูกกับทุก service</p><p><b>Choreography</b>: แต่ละ service ตอบสนองต่อ event เอง coupling ต่ำ แต่ดูภาพรวมยาก</p><p>ทั้งสองแบบต้องมี idempotent consumer, retry, DLQ และ distributed tracing</p>`, flow:["OrderCreated","Inventory: StockReserved","Payment: PaymentFailed","Inventory: StockReleased","Order: Cancelled"]}
 ],

{t:8, name:"Integration & Quality Gate", icon:"🧷",
 lessons:[
  {h:"ประเภทของการทดสอบ", b:`<ul><li><b>Integration</b> หลายส่วนจริงทำงานร่วมกัน เช่น repository กับฐานข้อมูลจริงใน container</li><li><b>Functional</b> ตรวจตาม requirement ผ่าน interface เช่น API</li><li><b>E2E</b> ทั้ง flow ผ่าน UI เหมือนผู้ใช้จริง</li><li><b>Regression</b> ตรวจว่าสิ่งที่เคยทำงานถูกยังไม่พังหลังแก้โค้ด</li></ul>`},
  {h:"Fixture, Spy และ API Test", b:`<p><b>Fixture</b> คือข้อมูลหรือสภาพแวดล้อมตั้งต้นที่เตรียมไว้ให้ทุกเทสต์ ส่วน <b>Spy</b> ดูการเรียกของจริง</p>`, lang:"JavaScript (Jest + supertest)",
   code:`const request = require("supertest");

beforeEach(async () => {
  await db.reset();
  await db.seed(fixtures.users);        // fixture
});

test("ดู order ของคนอื่น → 403", async () => {
  const res = await request(app)
    .get("/orders/99")
    .set("Authorization", tokenOf("bob"));
  expect(res.status).toBe(403);
});

const spy = jest.spyOn(mailer, "send");  // spy ของจริง`},
  {h:"Quality Gate และการแก้ Flaky Test", b:`<p><b>Quality gate</b> คือเกณฑ์ใน pipeline ที่ต้องผ่านก่อน merge หรือ deploy เช่นเทสต์ผ่านทั้งหมด, coverage ถึงเกณฑ์ และไม่มีช่องโหว่ระดับ critical</p><p>แก้ <b>flaky test</b>: ใช้ fake timer แทน sleep, แยกข้อมูลของแต่ละเทสต์, รอ event หรือสถานะที่ชัดเจน และไม่พึ่งลำดับการรัน</p>`, lang:"JavaScript (Jest)",
   code:`jest.useFakeTimers();
startCountdown();
jest.advanceTimersByTime(5000);   // ไม่ต้องรอ 5 วินาทีจริง
expect(onDone).toHaveBeenCalled();`}

/* ---- Application Security ---- */
{t:9, name:"MFA, RBAC & Threat Modeling", icon:"🪪",
 lessons:[
  {h:"MFA และ RBAC", b:`<p><b>MFA</b> ใช้ปัจจัยยืนยันตัวตนมากกว่าหนึ่งประเภท ได้แก่สิ่งที่รู้ (รหัสผ่าน), สิ่งที่มี (OTP หรือ security key) และสิ่งที่เป็น (ลายนิ้วมือ)</p><p><b>RBAC</b> กำหนดสิทธิ์ตามบทบาท แต่ยังต้องตรวจสิทธิ์<b>ระดับ object</b> เพิ่มด้วย เช่นเป็นเจ้าของ order นั้นจริงหรือไม่</p>`, lang:"JavaScript",
   code:`const PERMS = {
  admin: ["order:read", "order:delete"],
  staff: ["order:read"]
};
const can = (user, perm) => (PERMS[user.role] || []).includes(perm);

if (!can(req.user, "order:delete")) return res.status(403).end();`},
  {h:"OAuth2, Session vs JWT และ Secret Management", b:`<ul><li><b>OAuth2</b> คือ delegated authorization แอปฝั่ง browser หรือมือถือควรใช้ <b>Authorization Code + PKCE</b></li><li><b>Session</b> เก็บ state ที่ server จึงเพิกถอนได้ง่าย · <b>JWT</b> เป็น stateless แต่เพิกถอนยาก ให้ตั้งอายุสั้นและใช้ refresh token</li><li><b>Secret management</b>: เก็บ secret ใน secret manager หรือ vault ห้ามอยู่ในโค้ด, Git หรือ log และหมุนเปลี่ยนเป็นระยะ</li></ul>`},
  {h:"Threat Modeling (STRIDE)", b:`<p>ทำตั้งแต่<b>ช่วงออกแบบ</b> โดยถามว่าระบบโดนโจมตีได้อย่างไร แล้ววางวิธีป้องกันไว้ล่วงหน้า และทบทวนเมื่อสถาปัตยกรรมเปลี่ยน</p>`, lang:"STRIDE",
   code:`S  Spoofing                ปลอมตัวตน          → Authentication, MFA
T  Tampering               แก้ไขข้อมูล         → Signature, Integrity check
R  Repudiation             ปฏิเสธการกระทำ      → Audit log
I  Information Disclosure  ข้อมูลรั่ว           → Encryption, Least privilege
D  Denial of Service       ทำให้ใช้งานไม่ได้     → Rate limit, Autoscale
E  Elevation of Privilege  ยกระดับสิทธิ์         → Authorization ทุก request`}
 ],

/* ---- Monitoring ---- */
{t:10, name:"Triage จากข้อมูลจริง", icon:"🕵️",
 lessons:[
  {h:"Trace ID, Span ID, Correlation ID", b:`<ul><li><b>Trace ID</b> ใช้ระบุ request หนึ่งตัวตลอดทั้งเส้นทาง</li><li><b>Span ID</b> ใช้ระบุแต่ละ operation ย่อยภายใน trace</li><li><b>Correlation ID</b> ใช้ผูก log และ event ข้ามระบบเข้าด้วยกัน มักส่งผ่าน header เช่น <code>X-Request-ID</code></li></ul>`, lang:"JavaScript (Express)",
   code:`app.use((req, res, next) => {
  req.id = req.get("X-Request-ID") || crypto.randomUUID();
  res.set("X-Request-ID", req.id);       // ส่งต่อและตอบกลับ
  next();
});
logger.info({ requestId: req.id, op: "createOrder", outcome: "ok" });`},
  {h:"ขั้นตอน Triage", b:`<p>เมื่อได้รับ alert ให้<b>หยุดความเสียหายก่อน</b> (mitigate เช่น rollback หรือ scale) แล้วค่อยหาสาเหตุราก</p>`, flow:["อาการ/alert","ขอบเขตผลกระทบ","Timeline (deploy ล่าสุด?)","Golden Signals","Trace ที่ช้าหรือพัง","Log ของ span นั้น","Mitigate","RCA"]},
  {h:"ออกแบบ Alert และ Dashboard", b:`<ul><li>Alert ตาม<b>อาการที่กระทบผู้ใช้</b> เช่น error rate สูงหรือ SLO burn rate ไม่ใช่ทุกค่าที่ขยับ</li><li>ทุก alert ต้อง <b>actionable</b> และมีลิงก์ไป <b>runbook</b></li><li>หลีกเลี่ยง <b>alert fatigue</b> คือแจ้งเตือนบ่อยจนคนเลิกสนใจ</li><li>Dashboard แบบ <b>RED</b> (Rate, Errors, Duration) สำหรับ service และ <b>USE</b> (Utilization, Saturation, Errors) สำหรับทรัพยากร</li></ul>`}
 ],

/* ---- Container ---- */
{t:11, name:"Container ในงานจริง", icon:"🐳",
 lessons:[
  {h:"Registry, Tag และ Image Scanning", b:`<ul><li>ติด tag ที่<b>ระบุเวอร์ชันชัดเจน</b> เช่น semver หรือ git sha ไม่ใช้ <code>latest</code> บน production</li><li>Push ไปยัง <b>registry</b> แล้ว scan ช่องโหว่ใน CI ก่อน deploy</li></ul>`, lang:"bash",
   code:`docker build -t registry.example.com/shop/api:1.4.2 .
docker push registry.example.com/shop/api:1.4.2
trivy image registry.example.com/shop/api:1.4.2   # scan ช่องโหว่`},
  {h:"Health Check, Resource Limit, Env, Volume", b:`<p><b>Liveness</b> ตรวจว่ายังมีชีวิตอยู่ไหม ถ้าไม่ให้ restart ส่วน <b>Readiness</b> ตรวจว่าพร้อมรับ traffic หรือยัง เช่นต่อฐานข้อมูลได้แล้ว</p><p><b>Volume</b> Docker เป็นผู้จัดการ ส่วน <b>Bind mount</b> ผูกกับ path บนเครื่อง host</p>`, lang:"Dockerfile / bash",
   code:`HEALTHCHECK --interval=30s CMD wget -qO- http://localhost:3000/health || exit 1

docker run -d --name api -p 8080:3000 \\
  --memory=512m --cpus=1 \\
  -e DB_URL=postgres://db:5432/shop \\
  -v shop-data:/data \\
  registry.example.com/shop/api:1.4.2`},
  {h:"Troubleshoot Container", b:`<ul><li><code>docker ps -a</code> ดูสถานะและ exit code</li><li><code>docker logs</code> และ <code>docker exec -it ... sh</code></li><li><code>docker inspect</code> ดู config, network และ mount</li><li>Exit code <b>137</b> หมายถึงถูก kill มักเพราะเกิน memory limit (OOM)</li><li>ตรวจ port mapping และชื่อ network ให้ตรงกัน</li></ul>`}

/* ---- CI/CD ---- */
{t:12, name:"Pipeline ในงานจริง", icon:"🚀",
 lessons:[
  {h:"ตัวอย่าง Pipeline", b:`<p>จัดลำดับให้ <b>fail fast</b> คือให้ขั้นที่เร็วและจับปัญหาได้บ่อยรันก่อน</p>`, lang:"YAML (GitHub Actions)",
   code:`name: ci-cd
on: { push: { branches: [main] } }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: docker build -t app:sha-abc123 .
      - run: trivy image app:sha-abc123
  deploy-prod:
    needs: build
    environment: production     # ต้องมีคนอนุมัติ (Continuous Delivery)
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh app:sha-abc123`},
  {h:"Environment Promotion และ Rollback", b:`<p>ใช้ <b>artifact ตัวเดียวกัน</b>ตั้งแต่ dev ถึง prod โดยแยก config ตาม environment</p><p>วิธี rollback: deploy artifact เวอร์ชันก่อนหน้า, สลับ traffic กลับในแบบ blue-green หรือปิด feature flag</p><p><b>GitOps</b>: สถานะที่ต้องการของระบบอยู่ใน Git แล้วมีตัว sync ทำให้ cluster ตรงกับ Git</p>`, flow:["dev","staging","production"]},
  {h:"แก้ Pipeline ที่พัง", b:`<ul><li>อ่าน log ของ step ที่ fail ก่อนเสมอ</li><li>สาเหตุที่พบบ่อย: dependency, flaky test, cache, secret หรือ env หาย</li><li>Secret เก็บใน secret store ของ CI และต้องถูก <b>mask</b> ใน log</li><li>ห้ามแก้ด้วยการข้ามเทสต์</li></ul>`}

  {h:"Compute และ Storage", b:`<ul><li><b>VM</b> (IaaS) ควบคุมได้เต็มที่ แต่ต้องดูแลเอง</li><li><b>Managed Container</b> เช่น EKS, AKS, GKE หรือ Cloud Run</li><li><b>Serverless Function</b> scale ลงถึงศูนย์ได้และจ่ายตามการเรียก แต่มี cold start และจำกัดเวลารัน</li><li>Storage: <b>Object</b> (S3 เหมาะกับไฟล์และ backup), <b>Block</b> (disk ของ VM), <b>File</b> (shared filesystem)</li><li><b>Managed Database</b> ให้ provider ดูแล patch, backup และ failover</li></ul>`},

/* ---- AI & Prompt Engineering ---- */
{t:15, name:"AI ในระบบจริง", icon:"📡",
 lessons:[
  {h:"Token, Context Window และต้นทุน", b:`<ul><li>ข้อความถูกตัดเป็น <b>token</b> ทั้งราคาและ latency คิดตามจำนวน token</li><li><b>Context window</b> คือจำนวน token สูงสุดที่ model รับได้ต่อครั้ง</li><li>เอกสารยาวมากให้แบ่งเป็น <b>chunk</b> แล้วใช้ <b>RAG</b> ดึงเฉพาะส่วนที่เกี่ยวข้อง</li><li>ระวังการตัดข้อความจนข้อมูลสำคัญหายไป</li></ul>`},
  {h:"Evaluation และ Guardrail", b:`<p><b>Evaluation</b>: เตรียมชุดคำถามพร้อมคำตอบที่คาดหวัง วัด accuracy และ groundedness แล้วรันทุกครั้งที่เปลี่ยน prompt หรือ model</p><p><b>Guardrail</b>:</p><ul><li>ฝั่ง input: กรอง PII และ prompt injection</li><li>ฝั่ง output: ตรวจ schema, policy และสิทธิ์ก่อนนำไปทำ business action</li></ul>`, flow:["Eval set","รัน prompt v1 / v2","วัดผล","เลือกเวอร์ชันที่ดีกว่า","Monitor ต่อ"]},
  {h:"MLOps, Monitoring, Bias และ Explainability", b:`<ul><li>ทำ <b>version</b> ของ model และ prompt เพื่อกัน <b>version drift</b></li><li>Monitor คุณภาพ, cost, latency และ data drift</li><li><b>Bias</b>: ผลลัพธ์ลำเอียงต่อบางกลุ่ม ต้องทดสอบด้วยข้อมูลหลากหลาย</li><li><b>Explainability</b>: อธิบายได้ว่าทำไม AI ให้ผลแบบนั้น</li><li>งานที่มีผลกระทบสูงควรมี <b>human-in-the-loop</b></li></ul>`}

// normalise quiz items
const OLD_COUNT = STAGES.length;              // จำนวนด่านในเวอร์ชัน 2 (ใช้ย้ายความคืบหน้าเดิม)
STAGES.push(...MORE_ALGO, ...MORE_TOPICS);
STAGES.forEach(s=>{ if(EXTRA_Q[s.name]) s.quiz.push(...EXTRA_Q[s.name]); if(EXTRA_Q2[s.name]) s.quiz.push(...EXTRA_Q2[s.name]); if(EXTRA_Q3[s.name]) s.quiz.push(...EXTRA_Q3[s.name]); });   // ต่อท้าย เพื่อให้ id ข้อเดิมไม่เปลี่ยน
STAGES.forEach(s=>{ s.id=s.name; s.quiz = s.quiz.map((q,qi)=> Array.isArray(q)
  ? {type:"mc", q:q[0], code:q[1], opts:q[2], a:q[3], why:q[4], id:s.name+"#"+qi}
  : {type:"order", q:q.q, items:q.items, why:q.why, id:s.name+"#"+qi}); });
const STAGE_BY_ID = Object.fromEntries(STAGES.map((s,i)=>[s.id,i]));

// build node list: per world → stages of its topics, then a boss
const NODES = [];
WORLDS.forEach((w,wi)=>{
  const st=[];
  w.topics.forEach(ti=>STAGES.map((s,i)=>i).filter(i=>STAGES[i].t===ti)
    .sort((a,b)=>((STAGES[a].pos||0)-(STAGES[b].pos||0)) || a-b).forEach(i=>st.push(i)));
  st.forEach(i=>NODES.push({kind:"stage", s:i, w:wi, id:"s:"+STAGES[i].id}));
  NODES.push({kind:"boss", w:wi, pool:st, id:"b:"+wi});
});
NODES.forEach((n,i)=>n.idx=i);
const MAX_STARS = NODES.length*3;

const KEY = "devquest_hr2026_v3", OLD_KEY = "devquest_hr2026_v2";
let P = {nodes:{}, wrong:[], check:{}, known:{}};
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d){ P = Object.assign(P,d); return; }
    const old = JSON.parse(localStorage.getItem(OLD_KEY));      // ย้ายความคืบหน้าจากเวอร์ชันก่อน
    if(old){
      const oldIds=[];
      WORLDS.forEach((w,wi)=>{ for(let i=0;i<OLD_COUNT;i++) if(w.topics.includes(STAGES[i].t)) oldIds.push("s:"+STAGES[i].id); oldIds.push("b:"+wi); });
      Object.entries(old.nodes||{}).forEach(([k,v])=>{ if(oldIds[k]) P.nodes[oldIds[k]]=v; });
      P.wrong=(old.wrong||[]).map(x=>{ const [si,qi]=x.split(":").map(Number); return STAGES[si]? STAGES[si].id+"#"+qi : null; }).filter(Boolean);
      P.check=old.check||{};
      save();
    }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
load();

const RANKS = [[0,"Intern"],[2500,"Junior Coder"],[7000,"Code Explorer"],[13000,"Problem Solver"],[20000,"HackerRank Ready"],[26000,"Competency Master"]];
function totals(){
  let stars=0, xp=0, done=0;
  NODES.forEach((n,i)=>{ const p=P.nodes[n.id]; if(p){ stars+=p.stars; xp+= n.kind==="boss" ? p.best*20+p.stars*15 : p.best*25+p.stars*10; if(p.stars>0) done++; }});
  let rank=RANKS[0][1]; RANKS.forEach(([t,n])=>{ if(xp>=t) rank=n; });
  return {stars,xp,done,rank};
}
const cleared = i => !!(P.nodes[NODES[i].id] && P.nodes[NODES[i].id].stars>0);
const unlocked = i => i===0 || cleared(i-1) || cleared(i);
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
const starStr = n => [0,1,2].map(k=>`<span class="${k<n?'on':''}">★</span>`).join("");
const wclass = w => w==="A+"?"w-Ap":"w-"+w;
function shuffle(a){ a=a.slice(); for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]];} return a; }
function show(id){ ["map","level","review"].forEach(v=>$("#"+v).style.display = v===id?"block":"none"); window.scrollTo(0,0); }

/* ---------------- MAP ---------------- */

  $("#st-xp").textContent=t.xp; $("#st-rank").textContent="🏅 "+t.rank;
  return t;
}
function nodeTitle(n){ return n.kind==="boss" ? "BOSS: "+WORLDS[n.w].en : STAGES[n.s].name; }

    <p>${STAGES.length} ด่านบทเรียนและ ${WORLDS.length} ด่านบอส จาก 16 Competency ของคู่มืออ่านสอบ HackerRank 2026 แต่ละด่านเรียนสั้น ๆ แล้วตอบคำถาม 18–19 ข้อ ตอบถูก 70% ขึ้นไปจึงจะผ่าน (100% ได้ 3 ดาว) ส่วนบอสจะสุ่ม 10 ข้อจากทั้งโลกมาทบทวน</p></div>
    <div class="hero-prog"><span>ความคืบหน้า ${t.done}/${NODES.length} ด่าน</span><div class="bar"><i style="width:${t.done/NODES.length*100}%"></i></div>
    <div class="hero-btns">${current>=0?`<button class="btn sm" id="continue">▶ ${NODES[current].kind==="boss"?"สู้บอส":"เล่นด่าน "+(current+1)}</button>`:""}
    <button class="btn sec sm" id="hero-review">📚 ทบทวน${P.wrong.length?` (${P.wrong.length})`:""}</button></div></div>`;

  if(allDone){

    map.appendChild(f);
  }

  WORLDS.forEach((w,wi)=>{
    const sec=el("section","world"); sec.style.setProperty("--c",w.color);
    const nodes=NODES.filter(n=>n.w===wi);
    const ws=nodes.reduce((s,n)=>s+(P.nodes[n.id]?P.nodes[n.id].stars:0),0);
    sec.innerHTML=`<div class="world-head"><span class="world-num" style="background:${w.color}">WORLD ${wi+1}</span><h3>${w.name}</h3><span class="sub">${w.en} · ⭐ ${ws}/${nodes.length*3}</span></div>
      <div class="wtopics">${w.topics.map(ti=>`<span class="tbadge"><b class="${wclass(TOPICS[ti].w)}">${TOPICS[ti].w}</b>${TOPICS[ti].t} · ${TOPICS[ti].pct}%</span>`).join("")}</div>`;
    const path=el("div","path"); path.dataset.w=wi;
    nodes.forEach(n=>{
      const i=n.idx, open=unlocked(i), p=P.nodes[n.id];
      const b=el("button","node"+(n.kind==="boss"?" boss":"")+(cleared(i)?" done":"")+(i===current?" current":""));
      b.style.setProperty("--c",w.color);
      if(!open){ b.disabled=true; b.title="ผ่านด่านก่อนหน้าเพื่อปลดล็อก"; }
      const icon = n.kind==="boss" ? w.boss : STAGES[n.s].icon;
      const label = n.kind==="boss" ? "BOSS" : "STAGE "+String(i+1).padStart(2,"0");
      const sub = n.kind==="boss" ? "ทบทวนทั้งโลก" : STAGES[n.s].name;
      b.innerHTML=`${i===current?'<span class="tag-now">NOW</span>':""}<div class="orb">${open?icon:"🔒"}</div>
        <div class="info"><span class="lv">${label}</span><span class="nm">${sub}</span><span class="stars">${starStr(p?p.stars:0)}</span></div>`;
      b.onclick=()=>openNode(i);
      path.appendChild(b);
    });
    sec.appendChild(path); map.appendChild(sec);
  });

  const foot=el("div","footer-row");
  foot.innerHTML=`<span>เนื้อหาจาก Software Developer Competency 2026 · ความคืบหน้าบันทึกในเบราว์เซอร์นี้</span>`;
  const reset=el("button","ghost","รีเซ็ตความคืบหน้า"); let armed=false;
  reset.onclick=()=>{ if(!armed){armed=true; reset.textContent="กดอีกครั้งเพื่อยืนยัน"; reset.classList.add("warn"); setTimeout(()=>{armed=false; reset.textContent="รีเซ็ตความคืบหน้า"; reset.classList.remove("warn");},3000); return;}
    P={nodes:{},wrong:[],check:{},known:{}}; save(); renderMap(); };
  foot.appendChild(reset); map.appendChild(foot);

  const c=$("#continue"); if(c) c.onclick=()=>openNode(current);
  $("#hero-review").onclick=renderReview;
  layoutPaths();
}

/* snake layout + connectors */
function layoutPaths(){
  document.querySelectorAll(".path").forEach(path=>{
    const nodes=[...path.querySelectorAll(".node")];
    const W=path.clientWidth;
    const cols = W>=760?5: W>=560?4: W>=380?3:2;
    path.style.gridTemplateColumns=`repeat(${cols},1fr)`;
    nodes.forEach((n,i)=>{ const row=Math.floor(i/cols), pos=i%cols; const col = row%2===0? pos : cols-1-pos;
      n.style.gridRow=row+1; n.style.gridColumn=col+1; });
    let svg=path.querySelector("svg"); if(svg) svg.remove();
    svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    const pr=path.getBoundingClientRect();
    const pts=nodes.map(n=>{ const r=n.querySelector(".orb").getBoundingClientRect(); return [r.left-pr.left+r.width/2, r.top-pr.top+r.height/2]; });
    const color=getComputedStyle(nodes[0]).getPropertyValue("--c");
    for(let i=0;i<pts.length-1;i++){
      const [x1,y1]=pts[i],[x2,y2]=pts[i+1];
      const done = nodes[i].classList.contains("done");
      const p=document.createElementNS("http://www.w3.org/2000/svg","path");
      const d = Math.abs(y1-y2)<2 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} C${x1+(x1>x2?-1:1)*30},${(y1+y2)/2} ${x2+(x1>x2?1:-1)*30},${(y1+y2)/2} ${x2},${y2}`;
      p.setAttribute("d",d); p.setAttribute("fill","none");
      p.setAttribute("stroke", done?color:"#2b3166"); p.setAttribute("stroke-width", done?"4":"3");
      p.setAttribute("stroke-dasharray", done?"0":"7 7"); p.setAttribute("stroke-linecap","round");
      svg.appendChild(p);
    }
    path.prepend(svg);
  });
}
let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if($("#map").style.display==="block") layoutPaths(); },120); });

/* ---------------- SESSIONS ---------------- */
let S=null;
function makeItems(refs){ // refs: [{s,qi}]
  return refs.map(r=>{ const q=STAGES[r.s].quiz[r.qi];
    return {s:r.s, q, order: q.type==="mc"? shuffle(q.opts.map((_,k)=>k)) : shuffle(q.items.map((_,k)=>k)), seq:[], done:false, ok:null, picked:null}; });
}
function openNode(i){
  if(!unlocked(i)) return;
  const n=NODES[i], w=WORLDS[n.w];
  if(n.kind==="stage"){
    const st=STAGES[n.s];
    S={mode:"stage", node:i, color:w.color, title:st.icon+" "+st.name, kicker:`STAGE ${String(i+1).padStart(2,"0")} · ${TOPICS[st.t].t.toUpperCase()}`,
       lessons:st.lessons, topic:TOPICS[st.t], phase:"lesson", step:0, qi:0,
       items:makeItems(st.quiz.map((_,qi)=>({s:n.s,qi})))};
  } else {
    const all=[]; n.pool.forEach(s=>STAGES[s].quiz.forEach((_,qi)=>all.push({s,qi})));
    S={mode:"boss", node:i, color:w.color, title:w.boss+" BOSS · "+w.name, kicker:`BOSS · WORLD ${n.w+1}`,
       lessons:[], phase:"quiz", step:0, qi:0, items:makeItems(shuffle(all).slice(0,10))};
  }
  startSession();
}
function startReview(kind){
  let refs;
  if(kind==="wrong") refs = shuffle(P.wrong).slice(0,10).map(id=>{const k=id.lastIndexOf("#"); return {s:STAGE_BY_ID[id.slice(0,k)], qi:+id.slice(k+1)};}).filter(r=>r.s!==undefined && STAGES[r.s].quiz[r.qi]);
  else { const pool=[]; NODES.forEach(n=>{ if(n.kind==="stage" && cleared(n.idx)) STAGES[n.s].quiz.forEach((_,qi)=>pool.push({s:n.s,qi})); }); refs=shuffle(pool).slice(0,10); }
  if(!refs.length) return;
  S={mode:"review", kind, color:"#5eead4", title: kind==="wrong"?"🔁 ฝึกข้อที่เคยตอบผิด":"🎲 สุ่มทบทวน", kicker:"REVIEW MODE", lessons:[], phase:"quiz", step:0, qi:0, items:makeItems(refs)};
  startSession();
}
function startSession(){ show("level"); $("#level").style.setProperty("--c",S.color); renderLevel(); }
function exitSession(){ const m=S&&S.mode; S=null; if(m==="review") renderReview(); else renderMap(); }

function renderLevel(){
  const root=$("#level"); root.innerHTML="";
  const top=el("div","lv-top");
  const back=el("button","back", S.mode==="review"?"← ทบทวน":"← แผนที่"); back.onclick=exitSession;
  top.appendChild(back);
  top.appendChild(el("div","lv-title",`<div class="k">${S.kicker}</div><h2>${S.title}</h2>`));
  root.appendChild(top);

  const steps=el("div","steps");
  S.lessons.forEach((_,k)=>{ const s=el("i"); s.className = S.phase!=="lesson"||k<S.step ? "d" : k===S.step ? "cur" : ""; steps.appendChild(s); });
  S.items.forEach((it,k)=>{ const s=el("i"); s.className = it.done ? (it.ok?"ok":"no") : (S.phase==="quiz"&&k===S.qi ? "cur":""); steps.appendChild(s); });
  root.appendChild(steps);

  if(S.phase==="lesson") root.appendChild(lessonCard());
  else if(S.phase==="quiz") root.appendChild(quizCard());
  else root.appendChild(resultCard());
  if(S.phase!=="result") root.appendChild(el("div","hint-keys", S.phase==="lesson"?"คีย์ลัด: ← → เลื่อนบทเรียน · Esc กลับ":"คีย์ลัด: กดตัวเลขเพื่อเลือก · Enter ไปข้อต่อไป · Esc กลับ"));
}

function lessonCard(){
  const L=S.lessons[S.step]; const c=el("div","card");
  if(S.step===0) c.appendChild(el("div","def",`<b>${S.topic.t}</b> <span class="tbadge"><b class="${wclass(S.topic.w)}">${S.topic.w}</b>น้ำหนักข้อสอบ ${S.topic.pct}%</span><br>${S.topic.def}`));
  c.appendChild(el("div","eyebrow",`บทเรียน ${S.step+1}/${S.lessons.length}`));
  c.appendChild(el("h3",null,L.h));
  c.appendChild(el("div","body",L.b||""));
  if(L.flow){ const f=el("div","flow"); L.flow.forEach((x,k)=>{ if(k) f.appendChild(el("i",null,"→")); const s=el("span"); s.textContent=x; f.appendChild(s); }); c.appendChild(f); }
  if(L.code){ if(L.lang) c.appendChild(el("div","lang",L.lang)); const pre=el("pre"); pre.textContent=L.code; c.appendChild(pre); }
  const act=el("div","actions");
  const prev=el("button","btn sec","← ก่อนหน้า"); prev.disabled=S.step===0; prev.onclick=()=>{S.step--; renderLevel();};
  const last=S.step===S.lessons.length-1;
  const next=el("button","btn", last?"เริ่มตอบคำถาม ⚔️":"ถัดไป →"); next.onclick=()=>{ if(last) S.phase="quiz"; else S.step++; renderLevel(); };
  act.append(prev,next); c.appendChild(act);
  return c;
}

function quizCard(){
  const it=S.items[S.qi], q=it.q; const c=el("div","card");
  if(it.done || it.seq.length) c.style.animation="none";
  const src = S.mode!=="stage" ? ` · ${STAGES[it.s].name}` : "";
  c.appendChild(el("div","eyebrow",`คำถาม ${S.qi+1}/${S.items.length}${q.type==="order"?" · จัดลำดับ":""}${src}`));
  const h=el("h3"); h.textContent=q.q; c.appendChild(h);
  if(q.code){ const pre=el("pre"); pre.textContent=q.code; c.appendChild(pre); }

  if(q.type==="mc"){
    const box=el("div","opts");
    it.order.forEach((oi,pos)=>{
      const b=el("button","opt"); b.innerHTML=`<span class="key">${pos+1}</span><span class="t"></span>`;
      b.querySelector(".t").textContent=q.opts[oi];
      b.onclick=()=>chooseMC(oi);
      if(it.done){ b.disabled=true; if(oi===q.a) b.classList.add("right"); else if(oi===it.picked) b.classList.add("wrong"); else b.classList.add("fade"); }
      box.appendChild(b);
    });
    c.appendChild(box);
  } else {
    const seq=el("div","seq"+(it.done?(it.ok?" ok":" no"):""));
    if(!it.seq.length) seq.appendChild(el("div","ph","แตะตัวเลือกด้านล่างตามลำดับที่ถูกต้อง"));
    it.seq.forEach((ii,k)=>{ const r=el("div","it",`<b>${k+1}</b><span></span>`); r.querySelector("span").textContent=q.items[ii]; seq.appendChild(r); });
    c.appendChild(seq);
    if(!it.done){
      const box=el("div","opts");
      it.order.forEach((ii,pos)=>{
        const used=it.seq.includes(ii);
        const b=el("button","opt"+(used?" picked":"")); b.innerHTML=`<span class="key">${pos+1}</span><span class="t"></span>`;
        b.querySelector(".t").textContent=q.items[ii]; b.disabled=used;
        b.onclick=()=>pickOrder(ii); box.appendChild(b);
      });
      c.appendChild(box);
      if(it.seq.length){ const r=el("div","actions"); const clr=el("button","btn sec sm","↺ เริ่มเรียงใหม่"); clr.onclick=()=>{it.seq=[]; renderLevel();}; r.appendChild(clr); c.appendChild(r); }
    }
  }

  if(it.done){
    const w=el("div","why "+(it.ok?"g":"r"));
    w.innerHTML=`<strong>${it.ok?"✅ ถูกต้อง!":"❌ ยังไม่ถูก"}</strong>`;
    if(q.type==="order" && !it.ok){ const ol=el("ol"); q.items.forEach(x=>{const li=el("li"); li.textContent=x; ol.appendChild(li);}); w.appendChild(el("div",null,"ลำดับที่ถูกต้อง:")); w.appendChild(ol); }
    w.appendChild(document.createTextNode(q.why));
    c.appendChild(w);
    const act=el("div","actions"); act.style.justifyContent="flex-end";
    const last=S.qi===S.items.length-1;
    const nx=el("button","btn", last?"ดูผลลัพธ์ 🏁":"ข้อต่อไป →"); nx.id="nextq";
    nx.onclick=()=>{ if(last) S.phase="result"; else S.qi++; renderLevel(); };
    act.appendChild(nx); c.appendChild(act);
  }
  return c;
}
function markResult(it, ok){
  it.done=true; it.ok=ok;
  const id=it.q.id; const has=P.wrong.indexOf(id);
  if(!ok && has<0) P.wrong.push(id);
  if(ok && has>=0) P.wrong.splice(has,1);
  save(); renderLevel();
  const nx=$("#nextq"); if(nx) nx.focus({preventScroll:true});
}
function chooseMC(oi){ const it=S.items[S.qi]; if(it.done) return; it.picked=oi; markResult(it, oi===it.q.a); }
function pickOrder(ii){ const it=S.items[S.qi]; if(it.done||it.seq.includes(ii)) return; it.seq.push(ii);
  if(it.seq.length===it.q.items.length) markResult(it, it.seq.every((v,k)=>v===k)); else renderLevel(); }

function resultCard(){
  const total=S.items.length, correct=S.items.filter(x=>x.ok).length, wrong=total-correct;
  const c=el("div","card result");
  if(S.mode==="review"){
    c.appendChild(el("div","eyebrow","REVIEW COMPLETE"));
    c.appendChild(el("div","score",`${correct}/${total}`));
    c.appendChild(el("p",null, `ข้อที่ตอบถูกจะถูกนำออกจากคลังข้อผิด ตอนนี้เหลือข้อที่ต้องฝึกอีก <b style="color:var(--ink)">${P.wrong.length}</b> ข้อ`));
    const act=el("div","actions");
    const again=el("button","btn sec","↻ ทบทวนอีกรอบ"); again.onclick=()=>startReview(S.kind);
    const hub=el("button","btn","กลับหน้าทบทวน"); hub.onclick=renderReview;
    if(S.kind==="wrong" && !P.wrong.length) again.disabled=true;
    act.append(again,hub); c.appendChild(act); return c;
  }
  const isBoss=S.mode==="boss";
  const pct = correct/total;   // 100% → 3★, ≥85% → 2★, ≥70% → 1★
  const stars = pct===1?3 : pct>=0.85?2 : pct>=0.7?1 : 0;
  const passed=stars>0, i=S.node, prev=P.nodes[NODES[i].id], first=passed&&!cleared(i);
  if(passed){ P.nodes[NODES[i].id]={stars:Math.max(stars,prev?prev.stars:0), best:Math.max(correct,prev?prev.best:0)}; save(); }
  renderStats();
  c.appendChild(el("div","eyebrow", passed?(isBoss?"BOSS DEFEATED":"STAGE CLEAR"):"TRY AGAIN"));
  c.appendChild(el("div","big-stars",[0,1,2].map(k=>`<span class="${k<stars?'on':''}" style="animation-delay:${k*.15}s">★</span>`).join("")));
  c.appendChild(el("div","score",`${correct}/${total}`));
  c.appendChild(el("p",null, passed ? (stars===3?"เพอร์เฟกต์! ตอบถูกทุกข้อ 🎯":"ผ่านแล้ว! ตอบถูกครบทุกข้อเพื่อเก็บ 3 ดาว")
    : isBoss ? "บอสยังไม่ล้ม ต้องตอบถูกอย่างน้อย 70% ลองทบทวนด่านในโลกนี้แล้วกลับมาสู้ใหม่ 💪" : "ต้องตอบถูกอย่างน้อย 70% ถึงจะผ่าน ลองทบทวนบทเรียนแล้วลองใหม่นะ 💪"));
  if(wrong) c.appendChild(el("p",null,`📌 บันทึกข้อที่ผิด ${wrong} ข้อไว้ในโหมดทบทวนแล้ว`));
  if(first && i+1<NODES.length) c.appendChild(el("p",null,`🔓 ปลดล็อก: <b style="color:var(--ink)">${nodeTitle(NODES[i+1])}</b>`));
  if(first && i+1===NODES.length) c.appendChild(el("p",null,"🏆 ผ่านครบทุกด่านแล้ว! กลับไปที่แผนที่เพื่อดูใบรับรอง"));
  const act=el("div","actions");
  const retry=el("button","btn sec", isBoss?"↻ สู้ใหม่ (สุ่มคำถามใหม่)":"↻ ตอบคำถามใหม่");
  retry.onclick=()=>{ if(isBoss) openNode(i); else { S.items=makeItems(STAGES[NODES[i].s].quiz.map((_,qi)=>({s:NODES[i].s,qi}))); S.phase="quiz"; S.qi=0; renderLevel(); } };
  act.appendChild(retry);
  if(!isBoss){ const rv=el("button","btn sec","📖 ทบทวนบทเรียน"); rv.onclick=()=>{ S.items=makeItems(STAGES[NODES[i].s].quiz.map((_,qi)=>({s:NODES[i].s,qi}))); S.phase="lesson"; S.step=0; S.qi=0; renderLevel(); }; act.appendChild(rv); }
  if(passed && i+1<NODES.length){ const nx=el("button","btn", NODES[i+1].kind==="boss"?"สู้บอส →":"ด่านถัดไป →"); nx.onclick=()=>openNode(i+1); act.appendChild(nx); }
  else if(passed){ const m=el("button","btn","กลับแผนที่ 🗺️"); m.onclick=exitSession; act.appendChild(m); }
  c.appendChild(act);
  return c;
}

/* ---------------- REVIEW HUB ---------------- */
function renderReview(){
  S=null; show("review"); renderStats();
  const root=$("#review"); root.innerHTML=""; root.style.setProperty("--c","#5eead4");
  const top=el("div","lv-top"); const back=el("button","back","← แผนที่"); back.onclick=renderMap; top.appendChild(back);
  top.appendChild(el("div","lv-title",`<div class="k">REVIEW HUB</div><h2>📚 ทบทวนก่อนสอบ</h2>`)); root.appendChild(top);

  const clearedStages=NODES.filter(n=>n.kind==="stage"&&cleared(n.idx)).length;
  const g=el("div","rgrid");
  const a=el("div","rcard"); a.innerHTML=`<h3>🔁 ฝึกข้อที่เคยตอบผิด</h3><p>ข้อที่ตอบผิดจากทุกด่านจะเก็บไว้ที่นี่ ตอบถูกแล้วจะหายออกจากคลัง</p><div class="big-num">${P.wrong.length}</div>`;
  const ab=el("button","btn sm", P.wrong.length?`เริ่มฝึก (สูงสุด 10 ข้อ)`:"ยังไม่มีข้อผิด 🎉"); ab.disabled=!P.wrong.length; ab.onclick=()=>startReview("wrong"); ab.style.marginTop="10px"; a.appendChild(ab);
  const b=el("div","rcard"); b.innerHTML=`<h3>🎲 สุ่มทบทวน 10 ข้อ</h3><p>สุ่มคำถามจากทุกด่านที่ผ่านแล้ว เหมาะกับการทวนวันละรอบตามคำแนะนำในคู่มือ</p><div class="big-num">${clearedStages}<span style="font-size:16px;color:var(--muted)"> / ${STAGES.length} ด่าน</span></div>`;
  const bb=el("button","btn sm", clearedStages?"เริ่มสุ่มทบทวน":"ผ่านอย่างน้อย 1 ด่านก่อน"); bb.disabled=!clearedStages; bb.onclick=()=>startReview("random"); bb.style.marginTop="10px"; b.appendChild(bb);
  g.append(a,b); root.appendChild(g);


  // exam guide
  const eg=el("div","card"); eg.style.animation="none";
  eg.appendChild(el("div","eyebrow","EXAM GUIDE"));
  eg.appendChild(el("h3",null,"รูปแบบข้อสอบ HackerRank และวิธีอ่านคู่มือ"));
  const fm=el("div","fmt");
  EXAM_FORMATS.forEach(([n,tags])=>fm.appendChild(el("div",null,`<b>${n}</b>${tags.map(t=>`<span>${t}</span>`).join("")}`)));
  eg.appendChild(fm);
  const lg=el("div","legend"); LEVELS_LEGEND.forEach(([k,v])=>{ lg.appendChild(el("b",null,k)); lg.appendChild(el("span",null,v)); }); eg.appendChild(lg);
  eg.appendChild(el("div","body","<p><b>แผนเตรียมตัวที่คู่มือแนะนำ</b></p>"));
  const pl=el("ul","plan"); STUDY_PLAN.forEach(x=>{ const li=el("li"); li.textContent=x; pl.appendChild(li); }); eg.appendChild(pl);
  root.appendChild(eg);

  // flashcards
  const fcCard=el("div","card"); fcCard.style.animation="none"; fcCard.id="fc-card";
  root.appendChild(fcCard); renderFlash();

  // weights
  const wc=el("div","card"); wc.style.animation="none";
  wc.appendChild(el("div","eyebrow","EXAM WEIGHT"));
  wc.appendChild(el("h3",null,"น้ำหนักข้อสอบตาม Competency"));
  wc.appendChild(el("div","body","<p>ใช้จัดลำดับการทบทวน หัวข้อ A+ และ A มีน้ำหนักรวมกันมากกว่าครึ่งของข้อสอบ</p>"));
  const max=Math.max(...TOPICS.map(t=>t.pct));
  [...TOPICS].sort((x,y)=>y.pct-x.pct).forEach(t=>{
    const col = t.w==="A+"?"#fcd34d": t.w==="A"?"#5eead4": t.w==="B"?"#a78bfa":"#5c6396";
    const r=el("div","wrow",`<span><b class="${wclass(t.w)}" style="font-family:Silkscreen;font-size:11px;margin-right:6px">${t.w}</b>${t.t}</span><span class="wb"><i style="width:${t.pct/max*100}%;background:${col}"></i></span><span class="pc">${t.pct}%</span>`);
    wc.appendChild(r);
  });
  wc.appendChild(el("div","srcnote","* SQL & SQL Coding แสดงตามน้ำหนักของ SQL Coding (6.78%) ส่วน SQL แยกมีอีก 5.69%"));
  root.appendChild(wc);

  // checklist
  const cc=el("div","card"); cc.style.animation="none";
  const totalCk=CHECKLIST.reduce((s,g)=>s+g[1].length,0);
  const doneCk=Object.values(P.check).filter(Boolean).length;
  cc.appendChild(el("div","eyebrow","CHECKLIST"));
  cc.appendChild(el("h3",null,`Checklist ก่อนสอบ (${doneCk}/${totalCk})`));
  cc.appendChild(el("div","body","<p>ติ๊กเมื่ออธิบายหรือลงมือทำได้จริง หลักการจำจากคู่มือ: <b>รู้ความหมาย → รู้ว่าใช้เมื่อไร → รู้ข้อเสีย → ยกตัวอย่างได้ → แยกจากคำที่คล้ายกันได้</b></p>"));
  const bar=el("div","bar",`<i style="width:${doneCk/totalCk*100}%"></i>`); bar.style.margin="4px 0 16px"; cc.appendChild(bar);
  CHECKLIST.forEach(([gname,items],gi)=>{
    const grp=el("div","ck-group"); grp.appendChild(el("h4",null,gname));
    items.forEach((txt,ii)=>{ const k=gi+"-"+ii; const row=el("div","ck"+(P.check[k]?" on":""),`<span class="box">${P.check[k]?"✓":""}</span><span class="t"></span>`);
      row.querySelector(".t").textContent=txt;
      row.onclick=()=>{ const y=window.scrollY; P.check[k]=!P.check[k]; save(); renderReview(); window.scrollTo(0,y); };
      grp.appendChild(row); });
    cc.appendChild(grp);
  });
  root.appendChild(cc);
}


/* ---------------- FLASHCARDS ---------------- */
const FC = {cat:0, i:0, flip:false, onlyNew:false, order:null};
function fcList(){
  const all = FC.cat===-1 ? GLOSSARY.flatMap(g=>g[1]) : GLOSSARY[FC.cat][1];
  return FC.onlyNew ? all.filter(([t])=>!P.known[t]) : all;
}
function renderFlash(){
  const box=$("#fc-card"); if(!box) return; box.innerHTML="";
  const totalTerms=GLOSSARY.reduce((s,g)=>s+g[1].length,0);
  const knownCnt=Object.values(P.known).filter(Boolean).length;
  box.appendChild(el("div","eyebrow","FLASHCARDS · MASTER GLOSSARY"));
  box.appendChild(el("h3",null,`คำศัพท์ที่ต้องรู้ (จำได้แล้ว ${knownCnt}/${totalTerms})`));
  const tabs=el("div","fc-tabs");
  [[-1,"ทั้งหมด"],...GLOSSARY.map((g,i)=>[i,g[0]])].forEach(([i,n])=>{
    const t=el("button","fc-tab"+(FC.cat===i?" on":""), n);
    t.onclick=()=>{ FC.cat=i; FC.i=0; FC.flip=false; FC.order=null; renderFlash(); };
    tabs.appendChild(t);
  });
  box.appendChild(tabs);
  let list=fcList();
  if(FC.order && FC.order.length===list.length) list=FC.order.map(k=>list[k]);
  if(!list.length){ box.appendChild(el("div","flash",`<div class="term">🎉</div><div class="defn">จำได้ครบทุกคำในหมวดนี้แล้ว</div>`)); }
  else {
    if(FC.i>=list.length) FC.i=0;
    const [term,def]=list[FC.i];
    const f=el("div","flash"+(P.known[term]?" known":""));
    f.innerHTML=`<div class="term"></div>${FC.flip?'<div class="defn"></div>':''}<div class="hint">${FC.flip?"แตะเพื่อซ่อนความหมาย":"ลองนึกความหมายก่อน แล้วแตะเพื่อเปิด"}</div>`;
    f.querySelector(".term").textContent=term;
    if(FC.flip) f.querySelector(".defn").textContent=def;
    f.onclick=()=>{ FC.flip=!FC.flip; renderFlash(); };
    box.appendChild(f);
    const bar=el("div","fc-bar");
    const prev=el("button","btn sec sm","←"); prev.onclick=()=>{ FC.i=(FC.i-1+list.length)%list.length; FC.flip=false; renderFlash(); };
    const next=el("button","btn sec sm","→"); next.onclick=()=>{ FC.i=(FC.i+1)%list.length; FC.flip=false; renderFlash(); };
    const no=el("button","btn sec sm","🔁 ยังไม่แม่น");
    no.onclick=()=>{ P.known[term]=false; save(); FC.i=(FC.i+1)%list.length; FC.flip=false; renderFlash(); };
    const yes=el("button","btn sm","✓ จำได้แล้ว");
    yes.onclick=()=>{ P.known[term]=true; save(); if(!FC.onlyNew) FC.i=(FC.i+1)%list.length; FC.flip=false; FC.order=null; renderFlash(); };
    const left=el("div","fc-opts"); left.append(prev, el("span","cnt",`${FC.i+1} / ${list.length}`), next);
    const right=el("div","fc-opts"); right.append(no,yes);
    bar.append(left,right); box.appendChild(bar);
  }
  const opts=el("div","fc-opts"); opts.style.marginTop="12px";
  const lb=el("label",null,`<input type="checkbox" ${FC.onlyNew?"checked":""}> แสดงเฉพาะคำที่ยังจำไม่ได้`);
  lb.querySelector("input").onchange=e=>{ FC.onlyNew=e.target.checked; FC.i=0; FC.flip=false; FC.order=null; renderFlash(); };
  const sh=el("button","ghost","🔀 สลับลำดับ"); sh.onclick=()=>{ FC.order=shuffle(fcList().map((_,k)=>k)); FC.i=0; FC.flip=false; renderFlash(); };
  opts.append(lb,sh); box.appendChild(opts);
}

/* ---------------- KEYBOARD ---------------- */
document.addEventListener("keydown",e=>{
  if(!S) return;
  if(e.key==="Escape"){ exitSession(); return; }
  if(S.phase==="lesson"){
    if(e.key==="ArrowRight"||e.key==="Enter"){ e.preventDefault(); if(S.step<S.lessons.length-1) S.step++; else S.phase="quiz"; renderLevel(); }
    if(e.key==="ArrowLeft"&&S.step>0){ S.step--; renderLevel(); }
  } else if(S.phase==="quiz"){
    const it=S.items[S.qi];
    if(!it.done && /^[1-9]$/.test(e.key)){ const ii=it.order[+e.key-1]; if(ii===undefined) return; if(it.q.type==="mc") chooseMC(ii); else pickOrder(ii); }
    else if(e.key==="Enter" && it.done){ e.preventDefault(); const nx=$("#nextq"); if(nx) nx.click(); }
  }
});
$("#btn-review").onclick=()=>{ S=null; renderReview(); };
$("#home").onclick=()=>{ S=null; renderMap(); };

renderMap();
</script>
